<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lemon Bloom Haven | Quiet Time Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink: #FAF0F2;
      --card-white: #FFFFFF;
      --accent-pink: #F4C2C2;
      --accent-deep-pink: #E8A5A5;
      --text-dark: #332C2B;
      --text-muted: #7A6968;
      --border-color: #F0DADF;
      --shadow: 0 4px 20px rgba(220, 170, 180, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-pink);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    header {
      text-align: center;
      padding: 40px 0 20px;
    }

    header h1 {
      font-family: 'Lora', serif;
      font-size: 2.3rem;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .card {
      background: var(--card-white);
      border-radius: var(--radius);
      padding: 32px;
      margin-top: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-family: 'Lora', serif;
      font-size: 1.3rem;
      margin-bottom: 16px;
      color: var(--text-dark);
    }

    .verse-text {
      font-family: 'Lora', serif;
      font-size: 1.3rem;
      font-style: italic;
      line-height: 1.7;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .verse-ref {
      font-weight: 600;
      color: var(--accent-deep-pink);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .action-card {
      text-align: center;
      padding: 32px 24px;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF8F9 100%);
    }

    .btn-pink {
      display: inline-block;
      background-color: var(--accent-pink);
      color: var(--text-dark);
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px rgba(244, 194, 194, 0.4);
    }

    .btn-pink:hover {
      background-color: var(--accent-deep-pink);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    /* Interactive Expandable Journal Styles */
    .journal-drawer {
      display: none;
      margin-top: 20px;
      text-align: left;
      border-top: 1px dashed var(--border-color);
      padding-top: 20px;
    }

    .journal-drawer.active {
      display: block;
    }

    .journal-input {
      width: 100%;
      height: 130px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text-dark);
      background-color: #FFFDFE;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    .journal-input:focus {
      border-color: var(--accent-deep-pink);
    }

    .entries-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .entry-item {
      background: #FFFDFE;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      position: relative;
    }

    .entry-date {
      font-size: 0.8rem;
      color: var(--accent-deep-pink);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .entry-text {
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .delete-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .delete-btn:hover {
      color: #D9534F;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Lemon Bloom Haven</h1>
      <p>A quiet, cozy space for your daily time with Jesus</p>
    </header>

    <!-- Verse of the Day Card -->
    <main class="card">
      <h2 class="section-title">✨ Daily Memory Verse</h2>
      <p class="verse-text">"Be still, and know that I am God."</p>
      <p class="verse-ref">Psalm 46:10</p>
    </main>

    <!-- Interactive Devotional Journal Card -->
    <section class="card action-card">
      <h2 class="section-title">📖 Quiet Time Journal</h2>
      <p style="color: var(--text-muted);">Reflect on Scripture, record prayers, and keep daily thoughts private on your device.</p>
      
      <button class="btn-pink" id="toggleJournalBtn" onclick="toggleJournal()">Open Devotional Journal ✨</button>

      <!-- Expandable Interactive Drawer -->
      <div id="journalDrawer" class="journal-drawer">
        <textarea id="journalText" class="journal-input" placeholder="Write your quiet time prayers, thoughts, or reflections here..."></textarea>
        <button class="btn-pink" onclick="saveEntry()">Save Entry</button>

        <div class="entries-list" id="entriesList">
          <!-- Saved entries display here -->
        </div>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", displayEntries);

    function toggleJournal() {
      const drawer = document.getElementById("journalDrawer");
      const btn = document.getElementById("toggleJournalBtn");

      if (drawer.classList.contains("active")) {
        drawer.classList.remove("active");
        btn.textContent = "Open Devotional Journal ✨";
      } else {
        drawer.classList.add("active");
        btn.textContent = "Close Journal ✕";
      }
    }

    function saveEntry() {
      const textInput = document.getElementById("journalText");
      const text = textInput.value.trim();

      if (!text) return;

      const entries = JSON.parse(localStorage.getItem("lemonBloomEntries") || "[]");
      const newEntry = {
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        content: text
      };

      entries.unshift(newEntry);
      localStorage.setItem("lemonBloomEntries", JSON.stringify(entries));

      textInput.value = "";
      displayEntries();
    }

    function displayEntries() {
      const entries = JSON.parse(localStorage.getItem("lemonBloomEntries") || "[]");
      const listContainer = document.getElementById("entriesList");

      if (entries.length === 0) {
        listContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 14px;">Your saved entries will appear here.</p>';
        return;
      }

      listContainer.innerHTML = entries.map(entry => `
        <div class="entry-item">
          <div class="entry-date">${entry.date}</div>
          <div class="entry-text">${escapeHtml(entry.content)}</div>
          <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
        </div>
      `).join('');
    }

    function deleteEntry(id) {
      let entries = JSON.parse(localStorage.getItem("lemonBloomEntries") || "[]");
      entries = entries.filter(entry => entry.id !== id);
      localStorage.setItem("lemonBloomEntries", JSON.stringify(entries));
      displayEntries();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
