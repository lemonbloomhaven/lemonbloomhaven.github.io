<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemon Bloom Haven - Haven</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Comfortaa', 'cursive'],
                    },
                    colors: {
                        cozy: {
                            bgPink: '#FAF0F2',
                            cardWhite: '#FFFFFF',
                            pink: '#F4C2C2',
                            deepPink: '#E8A5A5',
                            textDark: '#332C2B',
                            textMuted: '#7A6968',
                            border: '#F0DADF'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF0F2;
            color: #332C2B;
            font-family: 'Quicksand', sans-serif;
        }
        .cozy-card {
            background: #FFFFFF;
            border: 1px solid #F0DADF;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(220, 170, 180, 0.12);
        }
        .cozy-btn-pink {
            background-color: #F4C2C2;
            color: #332C2B;
            transition: all 0.2s ease;
        }
        .cozy-btn-pink:hover {
            background-color: #E8A5A5;
            color: #FFFFFF;
        }
        .verse-bg-card {
            background: radial-gradient(circle at top left, #FFFBEB 0%, #FAF0F2 70%);
            border: 1px solid #FDE047;
            box-shadow: 0 4px 15px rgba(253, 224, 71, 0.15);
        }
    </style>
</head
