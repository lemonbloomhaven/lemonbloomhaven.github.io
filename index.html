<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemon Bloom Haven - Haven</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Comfortaa', 'cursive'],
                    },
                    colors: {
                        cozy: {
                            bgPink: '#FAF0F2',
                            cardWhite: '#FFFFFF',
                            pink: '#F4C2C2',
                            deepPink: '#E8A5A5',
                            textDark: '#332C2B',
                            textMuted: '#7A6968',
                            border: '#F0DADF'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF0F2;
            color: #332C2B;
            font-family: 'Quicksand', sans-serif;
        }
        .cozy-card {
            background: #FFFFFF;
            border: 1px solid #F0DADF;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(220, 170, 180, 0.12);
        }
        .cozy-btn-pink {
            background-color: #F4C2C2;
            color: #332C2B;
            transition: all 0.2s ease;
        }
        .cozy-btn-pink:hover {
            background-color: #E8A5A5;
            color: #FFFFFF;
        }
        .verse-bg-card {
            background-image: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 245, 247, 0.92)), url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <div class="max-w-4xl mx-auto w-full space-y-6">

        <!-- Top Navigation Header -->
        <header class="flex items-center justify-between bg-white px-6 py-4 rounded-2xl border border-[#F0DADF] shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#FFF9DB] border border-[#FDE047] flex items-center justify-center text-lg shadow-sm">
                    🍋
                </div>
                <div>
                    <h1 class="font-display font-bold text-base text-[#332C2B] tracking-wide">lemon<span class="text-[#E8A5A5]">bloom</span></h1>
                    <p class="text-[10px] text-[#7A6968] uppercase tracking-wider font-semibold">HAVEN</p>
                </div>
            </div>

            <a href="journal.html" class="cozy-btn-pink px-4 py-2 rounded-full text-xs font-bold shadow-sm flex items-center gap-2">
                <span>Open Journal</span> ✍️
            </a>
        </header>

        <!-- Hero Title Section -->
        <main class="text-center py-6 space-y-3">
            <h2 class="font-display font-bold text-3xl sm:text-4xl text-[#332C2B] leading-tight">
                Where cozy vibes meet <span class="text-[#E8A5A5]">daily verses</span>
            </h2>
            <p class="text-xs sm:text-sm text-[#7A6968] max-w-lg mx-auto">
                A warm, peaceful studio space designed for prayer, quiet reflection, and creative planning. Rest your heart and reflect on His promises daily.
            </p>
        </main>

        <!-- Dashboard Preview Box -->
        <section class="cozy-card p-6 sm:p-8 space-y-6" id="workspace">
            <div class="flex items-center justify-between">
                <div class="flex gap-2">
                    <span class="w-3 h-3 rounded-full bg-[#F4C2C2]"></span>
                    <span class="w-3 h-3 rounded-full bg-[#FFE5E8] border border-[#F0DADF]"></span>
                    <span class="w-3 h-3 rounded-full bg-[#CBE8C9]"></span>
                </div>
                <span class="text-[11px] font-bold text-[#E8A5A5]">✨ Cozy Studio Interactive Dashboard</span>
            </div>

            <!-- 1. Daily Verse Section (Moved to Top with Picture Background & Rotate Function) -->
            <div class="verse-bg-card p-6 rounded-2xl border border-[#F0DADF] shadow-sm space-y-3 transition-all duration-300 relative">
                <div class="flex justify-between items-center text-[11px] font-bold text-[#7A6968]">
                    <span class="flex items-center gap-1.5">
